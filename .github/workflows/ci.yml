name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: [1025:1025, 8025:8025]
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nuviora
          POSTGRES_PASSWORD: nuviora_local
          POSTGRES_DB: nuviora
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U nuviora -d nuviora" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://nuviora:nuviora_local@localhost:5432/nuviora?schema=public
      APP_ORIGIN: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@nuviora.local
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
